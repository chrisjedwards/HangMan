<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HangDev</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>HangDev<span class="prompt">_</span></h1>
      <p class="tagline">Programming &amp; tech word game, powered by AI</p>
    </header>

    <main>
      <!-- Setup screen: pick category/difficulty and start a game -->
      <section id="setup-screen" class="screen">
        <h2>New game</h2>
        <form id="setup-form">
          <label for="category-select">Category</label>
          <select id="category-select" name="category">
            <option value="programming_languages">Programming languages</option>
            <option value="devops_tools">DevOps tools</option>
            <option value="aws_services">AWS services</option>
            <option value="linux_commands">Linux commands</option>
          </select>

          <label for="difficulty-select">Difficulty</label>
          <select id="difficulty-select" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>

          <button type="submit" id="start-btn">Start game</button>
        </form>
        <p id="setup-error" class="error-message" role="alert" hidden></p>
      </section>

      <!-- Game screen: active round -->
      <section id="game-screen" class="screen" hidden>
        <div class="game-meta">
          <span id="meta-category" class="badge"></span>
          <span id="meta-difficulty" class="badge"></span>
          <span id="lives-display" class="lives" aria-live="polite"></span>
        </div>

        <div class="hangman-figure" aria-hidden="true">
          <svg viewBox="0 0 140 160" role="img">
            <line class="gallows" x1="10" y1="150" x2="90" y2="150" />
            <line class="gallows" x1="30" y1="150" x2="30" y2="10" />
            <line class="gallows" x1="30" y1="10" x2="100" y2="10" />
            <line class="gallows" x1="100" y1="10" x2="100" y2="28" />
            <circle id="part-head" class="part" cx="100" cy="42" r="14" />
            <line id="part-body" class="part" x1="100" y1="56" x2="100" y2="95" />
            <line id="part-arm-left" class="part" x1="100" y1="65" x2="82" y2="85" />
            <line id="part-arm-right" class="part" x1="100" y1="65" x2="118" y2="85" />
            <line id="part-leg-left" class="part" x1="100" y1="95" x2="84" y2="130" />
            <line id="part-leg-right" class="part" x1="100" y1="95" x2="116" y2="130" />
          </svg>
        </div>

        <p id="word-display" class="word-display" aria-live="polite"></p>

        <p class="wrong-letters">
          Wrong: <span id="wrong-letters">&ndash;</span>
        </p>

        <div class="hint-area">
          <button type="button" id="hint-btn">Get hint</button>
          <p id="hint-text" class="hint-text" hidden></p>
        </div>

        <div class="keyboard" id="keyboard" aria-label="Letter buttons"></div>

        <p id="game-error" class="error-message" role="alert" hidden></p>
      </section>

      <!-- End screen: result and AI comment -->
      <section id="end-screen" class="screen" hidden>
        <h2 id="end-title"></h2>
        <p id="end-word" class="word-display"></p>
        <p id="end-comment" class="comment-text" aria-live="polite">Getting AI comment&hellip;</p>
        <button type="button" id="play-again-btn">Play again</button>
      </section>
    </main>

    <footer class="site-footer">
      <p class="credit">
        <span class="credit-tag">//</span> made by
        <span class="credit-name">Gaby</span>
        <span class="credit-amp">&amp;</span>
        <span class="credit-name">Chris</span>
      </p>
    </footer>

    <script defer src="script.js"></script>
  </body>
</html>
